name: Prepare Linux build environment
description: >-
  Free disk space, bind-mount the large /mnt disk as _build and ghc/_build, fetch submodules
  and set up GHC/cabal. Shared by the cabal (build) and plinthc-test jobs. The
  repo must already be checked out so the runner can find this local action.

inputs:
  ghc-version:
    description: GHC version passed to haskell-actions/setup
    required: true

runs:
  using: composite
  steps:

  - name: Free disk space
    uses: jlumbroso/free-disk-space@main
    with:
      # this might remove tools that are actually needed,
      # if set to "true" but frees about 6 GB
      tool-cache: false

      # all of these default to true, but feel free to set to
      # "false" if necessary for your workflow
      android: true
      dotnet: true
      haskell: false
      # left off: it is slow (~1-2 min) and the bulk of the build now lives
      # on /mnt, so reclaiming large packages on / is not needed.
      large-packages: false
      docker-images: true
      swap-storage: true

  # Build on the large /mnt disk: _build (plinthc) and ghc/_build (hadrian).
  # See .github/bind-mount.sh.
  - name: Build on the large /mnt disk
    shell: bash
    run: bash .github/bind-mount.sh _build

  - name: Init and update submodules
    shell: bash
    run: bash .github/fetch-submodules.sh

  # After the submodule fetch: a non-empty ghc/ would stop the clone.
  - name: Build GHC on the large /mnt disk
    shell: bash
    run: bash .github/bind-mount.sh ghc/_build

  - uses: haskell-actions/setup@v2
    name: Setup Haskell tools
    with:
      ghc-version: ${{ inputs.ghc-version }}
      cabal-version: "latest"
      cabal-update: true
