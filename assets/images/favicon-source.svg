<!-- Flat master artwork for the Kardan mark: a white K (Liberation Sans Bold,
     the wordmark's font, 70% of the tile height) on the theme accent tile
     (#fc4d50). This is the geometry the header logo
     (_includes/svg/logo.svg) and the Safari pinned tab still use, and the
     reference the 3D mark was matched against.

